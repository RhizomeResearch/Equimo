repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        files: ^(src|tests|examples|models)/
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        files: ^(src|tests|examples|models)/
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check src
        language: system
        files: ^src/
        types: [python]
        pass_filenames: false
